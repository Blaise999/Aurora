name: Confirm Pending Mints

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-cron-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call Aurora cron route
        run: |
          curl --fail --show-error --silent \
            -H "x-internal-secret: ${{ secrets.NFT_CONFIRM_SECRET }}" \
            "https://YOUR_DOMAIN/api/cron/confirm-pending-mints"
